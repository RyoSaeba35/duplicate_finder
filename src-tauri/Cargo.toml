[package]
name = "dup-finder"
version = "0.1.0"
description = "Duplicate file finder — C++ scan engine, React UI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "shell-open", "shell-sidecar", "dialog-open", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Used only for the Job Object cleanup mechanism in main.rs -- see the
# comment on create_kill_on_close_job() there for why. Windows-only, so
# it's kept out of the dependency tree entirely on other platforms.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
