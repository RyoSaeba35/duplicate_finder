[package]
name = "dup-finder"
version = "0.2.0"
description = "Duplicate file finder — Rust scan engine, React UI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "protocol-asset", "shell-open", "dialog-open", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

sha2 = "0.10"
trash = "3"
walkdir = "2"
ureq = { version = "2", features = ["json"] }

# Parallel hashing — distributes SHA-256 work across all CPU cores.
# The hashing pass is the bottleneck on large drives; rayon's work-stealing
# thread pool handles it with no manual thread management needed.
rayon = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
